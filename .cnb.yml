# crawl-sim — CNB AI 自修复工作流（分阶段+缓存+有界重试）
# 借鉴旧工作流：分阶段流水线、成功步骤缓存、从报错步骤恢复、有界重试、受保护文件备份
# 模型: deepseek-v4-flash (免费 CodeBuddy V4.1 Flash)

main:
  push:
    - docker:
        image: python:3.11
      env:
        GITLAB_TOKEN: ${GITLAB_TOKEN}
      imports:
        - https://cnb.cool/xuerui911-mirror/crawl-secrets/-/blob/main/env.yml
      stages:
        - name: install-deps
          script: |
            python -m pip install --disable-pip-version-check -r requirements.txt || true
            # pytest 是 push CI 测试闸的执行器，多数仓 requirements.txt 未声明它；
            # 缺失时 `python -m pytest` 直接 127，push 流水线从未真正跑过测试。
            python -m pytest --version >/dev/null 2>&1 || python -m pip install --disable-pip-version-check pytest
            if ! command -v node >/dev/null 2>&1; then
              apt-get update -qq
              apt-get install -y -qq --no-install-recommends nodejs npm
            fi
            node --version
        - name: 推送代码到GitLab
          script: |
            if [ -z "$GITLAB_TOKEN" ]; then
              echo "未配置 GITLAB_TOKEN：跳过 GitLab 镜像同步（多端镜像按仓配置，非必需）"
            else
              printf '#!/bin/sh\ncase "$1" in *sername*) echo oauth2;; *) printf "%%s" "$GITLAB_TOKEN";; esac\n' > /tmp/gl-askpass.sh
              chmod +x /tmp/gl-askpass.sh
              git remote remove gitlab 2>/dev/null || true
              git remote add gitlab https://gitlab.com/xuerui911/crawl-sim.git
              if GIT_ASKPASS=/tmp/gl-askpass.sh git push gitlab main --force-with-lease 2>&1 \
                || GIT_ASKPASS=/tmp/gl-askpass.sh git push gitlab main 2>&1; then
                echo "GITLAB_PUSH=done" >> _stage_context_.env
              else
                echo "⚠️ GitLab 镜像推送失败（不阻断主流水线；令牌无效或过期请在 GitLab 重新签发）"
                echo "GITLAB_PUSH=failed" >> _stage_context_.env
              fi
              rm -f /tmp/gl-askpass.sh
            fi
        - name: pytest
          script: |
            # PIPESTATUS 是 bash 数组，CNB runner 用 sh(dash) 执行 stage 脚本会 Bad substitution(127)。
            # POSIX 取法：子 shell 内把真实退出码落盘，`| tee` 保持 stdout 实时回显——
            # 直接重定向会让 stdout 静默，触发 CNB「10 分钟无输出强杀」（vps 仓已实证）。
            rm -f _pytest_rc_.txt
            ( set +e; python -m pytest tests/ -x --tb=short 2>&1; echo $? > _pytest_rc_.txt ) | tee _test_result_.txt
            rc=$(cat _pytest_rc_.txt)
            echo "PYTEST_EXIT=$rc" >> _stage_context_.env
            # 此前退出码取 tee 的 0，测试失败从不使流水线变红（结构性假绿），现诚实穿透
            exit "$rc"
        - name: 语法校验
          script: |
            if python -m py_compile scripts/*.py; then
              echo "SYNTAX=PASS" >> _stage_context_.env
            else
              echo "SYNTAX=FAIL" >> _stage_context_.env
              echo "❌ SYNTAX 未通过：原写法 A && echo PASS || echo FAIL 的退出码恒为 0，属结构性假绿，现改为硬失败"
              exit 1
            fi
        - name: 治理校验
          script: |
            # 对齐 GitHub ci.yml:33 与 ci.yml:43-67（validate_syntax + merge classify 冒烟）
            python scripts/validate_syntax.py .github/workflows/*.yml
            python - <<'PY'
            import sys
            sys.path.insert(0, '.')
            from scripts.merge_data import classify
            sample = {
                "source": "中国联通", "plan_name": "测试套餐", "report_no": "T1",
                "region": "全国", "plan_type": "套餐",
                "monthly_fee": 59, "general_traffic_gb": 30,
                "orient_traffic_gb": 0, "voice_minutes": 100, "sms": 0,
                "contract": False, "service_content": "", "contract_desc": ""
            }
            assert classify(sample)["default_show"] is True
            sample2 = dict(sample, plan_name="送手机合约", monthly_fee=129, contract=True)
            out2 = classify(sample2)
            assert out2["default_show"] is False and out2["excluded_phone_contract"] is True
            print("merge classify OK")
            PY
      failStages:
        - name: 诊断-收集失败上下文
          script: |
            {
              echo "## 失败概览"
              echo "| 项目 | 内容 |"
              echo "| --- | --- |"
              echo "| 失败阶段 | $CNB_BUILD_FAILED_STAGE_NAME |"
              echo "| 失败原因 | \`$CNB_BUILD_FAILED_MSG\` |"
              echo "| 触发分支 | $CNB_BRANCH |"
              echo "| 提交 | $CNB_COMMIT_SHORT |"
              echo "| 构建日志 | $CNB_BUILD_WEB_URL |"
              echo ""
              echo "## 测试输出（最后50行）"
              echo '```'
              tail -50 _test_result_.txt 2>/dev/null || echo "(无)"
              echo '```'
              echo ""
              echo "## 阶段上下文"
              cat _stage_context_.env 2>/dev/null || echo "(无)"
            } > _fail_context_.md
        - name: 备份受保护文件
          script: |
            for f in AGENTS.md ai_tools/opencode/opencode.json ai_tools/opencode/oh-my-openagent.json; do
              [ -f "$f" ] && cp "$f" "${f}.protected_backup"
            done
        - name: AI-修复-第1轮
          type: npc:go
          options:
            model: deepseek-v4-flash
            thinkingLevel: max
            maxTurns: 40
            contextWindow: 256k
            systemPrompt: |
              你是运营商资费爬虫修复专家。阅读 _fail_context_.md 中的失败上下文。
              这是第1轮修复（最多2轮）。分析根因后修改代码。
              规则：不伪造数据、不折叠真冲突、不删校验、不降防护。
              多期总价折算优先级正确，排除购机合约，月租>200不进Pages。
              修复后写报告到 _fix_report_.md。
            userPrompt: |
              读取 _fail_context_.md，分析失败并修复。修复后写报告到 _fix_report_.md。
        - name: 恢复受保护文件
          script: |
            for f in AGENTS.md ai_tools/opencode/opencode.json ai_tools/opencode/oh-my-openagent.json; do
              if [ -f "${f}.protected_backup" ] && ! cmp -s "$f" "${f}.protected_backup" 2>/dev/null; then
                echo "⚠️ 恢复受保护文件 $f"
                cp "${f}.protected_backup" "$f"
              fi
            done
            find . -name '*.protected_backup' -delete
        - name: 验证-语法校验
          script: |
            python -m py_compile scripts/*.py 2>/dev/null && echo "SYNTAX_VALIDATE=PASS" >> _fix_report_.md || { echo "SYNTAX_VALIDATE=FAIL" >> _fix_report_.md; exit 1; }
        - name: 验证-pytest
          script: |
            rm -f _pytest_rc_after_.txt
            ( set +e; python -m pytest tests/ -x --tb=short 2>&1; echo $? > _pytest_rc_after_.txt ) | tee _test_after_fix_.txt
            rc=$(cat _pytest_rc_after_.txt)
            if [ "$rc" -eq 0 ]; then echo "PYTEST_VALIDATE=PASS" >> _fix_report_.md; else echo "PYTEST_VALIDATE=FAIL" >> _fix_report_.md; fi
            echo "PYTEST_EXIT_AFTER=$rc" >> _stage_context_.env
        - name: 审查-NPC代码审查
          type: npc:go
          options:
            model: deepseek-v4-flash
            thinkingLevel: high
            maxTurns: 15
            contextWindow: 128k
            systemPrompt: |
              你是代码审查员。读取 _fail_context_.md、_fix_report_.md、_test_after_fix_.txt。
              检查：资费折算正确性、发布过滤、宽带视图完整性、排除购机合约、测试断言同步。
              写审查结果到 _review_result_.md，第一行 VERDICT: PASS 或 VERDICT: FAIL。
            userPrompt: |
              审查修复结果，输出到 _review_result_.md。
        - name: 最终判定
          script: |
            # 反篡改闸：自修复不得改动断言或流水线配置（为变绿改测试属禁止项，改为机器强制）
            if ! git diff --quiet -- tests .cnb.yml 2>/dev/null; then
              echo "X 自修复改动了 tests/ 或 .cnb.yml，判定为篡改门禁，硬失败"
              git diff --stat -- tests .cnb.yml || true
              exit 1
            fi
            AFTERRC=$(grep -o 'PYTEST_EXIT_AFTER=[0-9]*' _stage_context_.env 2>/dev/null | tail -1)
            if [ "${AFTERRC#PYTEST_EXIT_AFTER=}" != "0" ]; then
              echo "X 修复后 pytest 仍非零退出（$AFTERRC），修复未真正通过"
              exit 1
            fi
            VERDICT=$(head -1 _review_result_.md 2>/dev/null | grep -o 'PASS\|FAIL' || echo "UNKNOWN")
            echo "审查结果: $VERDICT"
            [ "$VERDICT" = "PASS" ] && echo "✅ 修复通过" || { echo "❌ 修复未通过"; exit 1; }

  api_trigger:
    - runner:
        cpus: 2
      docker:
        image: python:3.12
      imports:
        - https://cnb.cool/xuerui911-mirror/crawl-secrets/-/blob/main/env.yml
      timeout: 2h
      stages:
        - name: 检查代理配置
          script: |
            if [ -z "$PROXY_SUBSCRIPTIONS" ]; then
              echo "FAIL_STAGE=检查代理配置 reason=no PROXY_SUBSCRIPTIONS"; exit 1
            fi
            echo "OK_STAGE=检查代理配置"
        - name: install-deps
          script: |
            python -m pip install -r requirements.txt
            python -m pip install playwright==1.61.0
            python -m playwright install --with-deps chromium-headless-shell
            echo "OK_STAGE=install-deps"
        - name: 启动Mihomo代理
          script: |
            set -e
            # 调优（2026-10-07）：~100s 失败根因=代理订阅/mihomo 启动/测试单点，网络间歇抖动。
            # 加 3 次重试 + 进度输出（防 CNB 10 分钟无输出强杀）+ 测试 URL 降级。
            OK=0
            for ATTEMPT in 1 2 3; do
              echo "[proxy] attempt $ATTEMPT/3 $(date -u +%H:%M:%S)"
              : > /tmp/proxy.env
              if python scripts/setup_proxy_runtime.py --github-env /tmp/proxy.env --require-proxy --test-url https://m.10099.com.cn/costNotice/; then
                OK=1; break
              fi
              echo "[proxy] attempt $ATTEMPT failed, retry in 15s"
              sleep 15
            done
            if [ "$OK" != "1" ]; then
              echo "FAIL_STAGE=启动Mihomo代理 reason=3-attempts-exhausted"; exit 1
            fi
            sed 's/^\([A-Za-z_][A-Za-z0-9_]*\)=/export \1=/' /tmp/proxy.env > /tmp/proxy.sh
            . /tmp/proxy.sh
            if [ "${PROXY_ENABLED:-false}" != "true" ]; then
              echo "FAIL_STAGE=启动Mihomo代理 reason=PROXY_ENABLED!=true"; exit 1
            fi
            echo "OK_STAGE=启动Mihomo代理 HTTP_PROXY=$HTTP_PROXY"
        - name: 获取线上发布基线
          script: |
            set -e
            mkdir -p /tmp/cnb-baseline
            for URL in \
              "https://crawl-sim.pages.dev/data/filtered.json" \
              "https://sim.jiucai.eu.org/data/filtered.json"; do
              if curl --fail --show-error --silent --location --retry 3 --retry-all-errors \
                   --connect-timeout 20 --max-time 300 "$URL" \
                   -o /tmp/cnb-baseline/baseline.json; then
                ROWS=$(python -c "import json;d=json.load(open('/tmp/cnb-baseline/baseline.json',encoding='utf-8'));assert isinstance(d,list);print(len(d))" 2>/dev/null || echo 0)
                if [ "${ROWS:-0}" -ge 20 ]; then
                  echo "BASELINE=$URL rows=$ROWS"
                  echo "OK_STAGE=获取线上发布基线"
                  exit 0
                fi
              fi
            done
            echo "FAIL_STAGE=获取线上发布基线 reason=no-baseline"; exit 1
        - name: 爬取-四源并行
          script: |
            . /tmp/proxy.sh
            if [ "${DEBUG_MODE:-false}" = "true" ]; then
              MODE="debug小批量"; BN_MR=20; MO_MR=20; TE_MR=20; UN_MR=20; UN_SL=240
            else
              MODE="日间全量";   BN_MR=50; MO_MR=60; TE_MR=80; UN_MR=100; UN_SL=480
            fi
            echo "爬取模式：$MODE DEBUG_MODE=${DEBUG_MODE:-unset}"
            python scripts/crawl_broadnet.py --output data/broadnet.json --min-records "$BN_MR" \
              || echo "WARN broadnet failed" &
            python scripts/crawl_mobile.py --output data/mobile.json --min-records "$MO_MR" \
              || echo "WARN mobile failed" &
            python scripts/crawl_telecom.py --output data/telecom.json --min-records "$TE_MR" \
              || echo "WARN telecom failed" &
            python scripts/crawl_unicom.py --output data/unicom.json --min-records "$UN_MR" --soft-limit "$UN_SL" \
              || echo "WARN unicom failed" &
            wait
            ls -la data/*.json 2>/dev/null || echo "no json artifacts"
            echo "OK_STAGE=爬取-四源并行"
        - name: 清理代理环境
          script: python scripts/setup_proxy_runtime.py --clear || true
        - name: 合并-校验-保留基线
          script: |
            set -e
            mkdir -p dist
            python scripts/merge_data.py --data-dir data --output dist/merged.json
            python - <<'PY'
            import json, sys
            rows = json.load(open('dist/merged.json', encoding='utf-8'))
            shown = [r for r in rows if r.get('default_show')]
            if len(rows) == 0:
                print("FAIL merged 0 rows", file=sys.stderr); sys.exit(1)
            print(f"merged={len(rows)} shown={len(shown)}")
            PY
            python - <<'PY'
            import json
            rows = json.load(open('dist/merged.json', encoding='utf-8'))
            shown = [r for r in rows if r.get('default_show')]
            json.dump(shown, open('dist/latest.json', 'w', encoding='utf-8'), ensure_ascii=False, indent=1)
            json.dump(rows, open('dist/filtered.json', 'w', encoding='utf-8'), ensure_ascii=False, indent=1)
            PY
            rm -rf site
            mkdir -p site/data site/config
            cp -R docs/. site/
            cp config/filter_conditions.json site/config/filter_conditions.json
            cp dist/latest.json site/data/latest.json
            cp dist/filtered.json site/data/filtered.json
            python - <<'PY'
            import json
            from datetime import datetime, timezone
            rows = json.load(open('site/data/latest.json', encoding='utf-8'))
            manifest = {
                "date": datetime.now(timezone.utc).strftime("%Y%m%d"),
                "updatedAt": datetime.now(timezone.utc).isoformat(),
                "rowCount": len(rows),
                "shownCount": len(rows),
                "sources": sorted({r.get('source') for r in rows}),
                "files": {"latestJson": "data/latest.json", "filteredJson": "data/filtered.json"},
            }
            with open('site/data/manifest.json', 'w', encoding='utf-8') as f:
                json.dump(manifest, f, ensure_ascii=False, indent=2)
            print(f"staged {len(rows)} rows date={manifest['date']}")
            PY
            touch site/.nojekyll
            echo "OK_STAGE=合并-校验"
        - name: 推送数据到GitHub Release
          timeout: 25m
          script: |
            set -e
            python scripts/publish_github_release.py --site-dir site --repo Fatty911/crawl-sim --workflow cnb-pages.yml
        - name: 发布到Cloudflare Pages
          image: node:22
          script: |
            set -e
            if [ -z "$CLOUDFLARE_API_TOKEN" ]; then
              echo "FAIL_STAGE=发布CF reason=no token"; exit 1
            fi
            npx -y wrangler@latest pages deploy site --project-name crawl-sim --commit-dirty=true
            echo "OK_STAGE=发布CF"

        - name: 线上验收
          script: |
            python - <<'PY'
            import json, time, urllib.request
            for url in ["https://crawl-sim.pages.dev/data/manifest.json","https://sim.jiucai.eu.org/data/manifest.json"]:
                try:
                    d=json.load(urllib.request.urlopen(url, timeout=30))
                    print(url, "date=", d.get("date"), "rows=", d.get("rowCount"))
                except Exception as e:
                    print(url, "ERR", e)
            PY
            echo "OK_STAGE=线上验收"

      failStages:
        - name: 诊断-收集失败上下文
          script: |
            {
              echo "## 流水线失败诊断"
              echo "| 项目 | 内容 |"
              echo "| --- | --- |"
              echo "| 失败阶段 | $CNB_BUILD_FAILED_STAGE_NAME |"
              echo "| 失败原因 | `$CNB_BUILD_FAILED_MSG` |"
              echo "| 触发分支 | $CNB_BRANCH |"
              echo "| 提交 | $CNB_COMMIT_SHORT |"
              echo "| 构建日志 | $CNB_BUILD_WEB_URL |"
              echo "| DEBUG_MODE | ${DEBUG_MODE:-unset} |"
              echo ""
              echo "## 阶段上下文"
              cat _stage_context_.env 2>/dev/null || echo "(无)"
              echo ""
              echo "## 最近文件"
              ls -la data/ dist/ site/ 2>/dev/null || echo "(无产物)"
            } > _fail_context_.md
            echo "诊断已写入 _fail_context_.md"
        - name: NPC-自动调优
          type: npc:go
          options:
            model: deepseek-v4-flash
            thinkingLevel: max
            maxTurns: 30
            contextWindow: 256k
            systemPrompt: |
              你是 CNB 流水线调优专家。阅读 _fail_context_.md 中的失败上下文。
              目标：让流水线下次跑通并刷新 Pages 数据日期。
              调优原则：
              1. 网络抖动/超时 → 加重试、放宽 timeout、换测试 URL
              2. 代理失败 → 检查 PROXY_SUBSCRIPTIONS、重试次数、降级策略
              3. 爬取 0 行 → 检查 min-records、选择器、反爬
              4. 发布失败 → 检查 token、网络、产物路径
              5. 不伪造数据、不删校验、不降防护
              修改后写报告到 _tune_report_.md。
            userPrompt: |
              读取 _fail_context_.md，分析失败根因，调优 .cnb.yml 或相关脚本让下次跑通。
              修改后写报告到 _tune_report_.md。
        - name: 验证-语法校验
          script: |
            python -m py_compile scripts/*.py 2>/dev/null && echo "SYNTAX_OK" >> _tune_report_.md || { echo "SYNTAX_FAIL" >> _tune_report_.md; exit 1; }
        - name: 重触发-自动重跑
          script: |
            # 自动重触发：调优后重新跑一轮（最多重试 2 次，由 RETRY_COUNT 控制）
            RETRY_COUNT="${RETRY_COUNT:-0}"
            if [ "$RETRY_COUNT" -ge 2 ]; then
              echo "已达最大重试次数 2，停止自动重试"
              exit 0
            fi
            NEXT=$((RETRY_COUNT + 1))
            echo "自动重触发第 $NEXT 次"
            if [ -n "$CNB_TOKEN" ]; then
              curl -sS -X POST \
                -H "Authorization: Bearer $CNB_TOKEN" \
                -H "Content-Type: application/json" \
                "https://api.cnb.cool/xuerui911-mirror/crawl-sim/-/build/start" \
                -d "{\"branch\":\"$CNB_BRANCH\",\"event\":\"api_trigger\",\"env\":{\"DEBUG_MODE\":\"${DEBUG_MODE:-false}\",\"RETRY_COUNT\":\"$NEXT\"}}" \
                || echo "WARN 重触发失败，请手动触发"
            else
              echo "WARN 无 CNB_TOKEN，无法自动重触发"
            fi
  "crontab: 0 4 7,22 * *":
    # 半月增量爬取（每月 7/22 日 04:00 Asia/Shanghai，四运营商源错峰）
    # 增量闭环：发布基线取线上站点当前数据（data/、dist/、docs/data 均被 .gitignore:2-4 忽略，发布物不入仓），发布前校验不缩小
    # 代理：PROXY_SUBSCRIPTIONS 走 CNB 仓库环境变量，缺失即失败，禁止直连裸爬
    - runner:
        cpus: 2
      docker:
        image: python:3.12
      imports:
        - https://cnb.cool/xuerui911-mirror/crawl-secrets/-/blob/main/env.yml
      timeout: 2h  # CNB Job 无输出默认 10min 即强杀（实测联通源被砍），显式放宽
      stages:
        - name: 检查代理配置
          script: |
            if [ -z "$PROXY_SUBSCRIPTIONS" ]; then
              echo "❌ 未注入 PROXY_SUBSCRIPTIONS：本流水线经 imports 引用 xuerui911-mirror/crawl-secrets env.yml，请检查该私仓。防反爬必须走 Mihomo 代理。"
              exit 1
            fi
        - name: install-deps
          script: |
            python -m pip install -r requirements.txt
            # 原件 crawl-mobile.yml 显式安装 playwright（requirements.txt 未声明）；
            # 静默 || echo 会让 mobile/telecom/unicom 三个浏览器源全部 ModuleNotFoundError 却仍报绿
            python -m pip install playwright==1.61.0
            python -m playwright install --with-deps chromium-headless-shell
        - name: 启动Mihomo代理
          script: |
            set -e
            # 本仓 setup_proxy_runtime.py 成功/降级都只写 $GITHUB_ENV（append_github_env:88-90 空路径直接跳过），CNB 无该变量
            # → 必须 --github-env 显式导出 + sed 转 export + source，并硬校验 PROXY_ENABLED，禁止降级直连裸爬
            : > /tmp/proxy.env
            python scripts/setup_proxy_runtime.py --github-env /tmp/proxy.env --require-proxy --test-url https://m.10099.com.cn/costNotice/
            sed 's/^\([A-Za-z_][A-Za-z0-9_]*\)=/export \1=/' /tmp/proxy.env > /tmp/proxy.sh
            . /tmp/proxy.sh
            if [ "${PROXY_ENABLED:-false}" != "true" ]; then
              echo "❌ 代理未启用（PROXY_ENABLED!=true），防反爬要求禁止直连裸爬，终止本轮"
              exit 1
            fi
            echo "代理就绪：$HTTP_PROXY"
        - name: 获取线上发布基线
          script: |
            set -e
            mkdir -p /tmp/cnb-baseline
            # 仓内 docs/data/latest.json 被 .gitignore:2(data/) 忽略、从不入仓（deploy-pages.yml 只发布 site/ 不落仓），
            # '[]' 空基线会让 superset 校验假绿并把线上行数塌到本轮爬取量 → 以 CNB 实际发布站当前数据为基线，拉不到即硬失败
            for URL in \
              "https://crawl-sim.pages.dev/data/filtered.json" \
              "https://sim.jiucai.eu.org/data/filtered.json"; do
              if curl --fail --show-error --silent --location --retry 3 --retry-all-errors \
                   --connect-timeout 20 --max-time 300 "$URL" \
                   -o /tmp/cnb-baseline/baseline.json; then
                ROWS=$(python -c "import json;d=json.load(open('/tmp/cnb-baseline/baseline.json',encoding='utf-8'));assert isinstance(d,list);print(len(d))" 2>/dev/null || echo 0)
                if [ "${ROWS:-0}" -ge 20 ]; then
                  echo "BASELINE=$URL rows=$ROWS"
                  exit 0
                fi
                echo "⚠️ $URL 基线行数异常（$ROWS），尝试下一个来源"
              fi
            done
            echo "❌ 所有基线来源均不可用，禁止本轮发布（绝不退化为空基线）"
            exit 1
        - name: 爬取-四源并行
          script: |
            . /tmp/proxy.sh
            # 时段分档（用户裁定 2026-10-01）：夜间（23:00-08:00，容器时区 Asia/Shanghai）
            # 自动小批量——每源 min-records 20、联通软超时缩到 300s，让全链（合并→发布）
            # 夜里也能完整推进不被长爬拖死；日间恢复全量。增量合并下两种量级的数据都入库。
            HOUR=$(date +%H)
            if [ "$HOUR" -ge 23 ] || [ "$HOUR" -lt 8 ]; then
              MODE="夜间小批量"; BN_MR=20; MO_MR=20; TE_MR=20; UN_MR=20; UN_SL=300
            else
              MODE="日间全量";   BN_MR=50; MO_MR=60; TE_MR=80; UN_MR=100; UN_SL=480
            fi
            # debug_mode（对齐 GitHub workflow_dispatch inputs.debug_mode）：
            # DEBUG_MODE=true 时强制小批量，过作息窗口也能跑通全链并刷新 Pages 日期
            if [ "${DEBUG_MODE:-false}" = "true" ]; then
              MODE="debug小批量"; BN_MR=20; MO_MR=20; TE_MR=20; UN_MR=20; UN_SL=240
              echo "DEBUG_MODE=true: 强制小批量（每源 20 条）"
            fi
            echo "爬取模式：$MODE（hour=$HOUR）"
            # 四源并行（用户裁定 2026-10-01：源间并行、单源任何形态失败都不拖垮其它源与下游）。
            # 各源自带 `|| echo` 兜底（任何退出码都转 success）且互为后台任务——被强杀/挂死也
            # 只影响自身；wait 后无论结果都继续，合并腿对 0 行有硬失败防线、部分行警告发布。
            # 四源并发输出轮流到达，天然规避 CNB「连续 10 分钟无输出强杀」（串行时代联通独享
            # 静默期被杀，sn=cnb-dks 前 shifting 实证）。
            python scripts/crawl_broadnet.py --output data/broadnet.json --min-records "$BN_MR" \
              || echo "⚠️ 广电 单源失败" &
            python scripts/crawl_mobile.py --output data/mobile.json --min-records "$MO_MR" \
              || echo "⚠️ 移动 单源失败" &
            python scripts/crawl_telecom.py --output data/telecom.json --min-records "$TE_MR" \
              || echo "⚠️ 电信 单源失败" &
            python scripts/crawl_unicom.py --output data/unicom.json --min-records "$UN_MR" --soft-limit "$UN_SL" \
              || echo "⚠️ 联通 单源失败" &
            wait
            echo "四源并行结束（$MODE），data/ 产物："
            ls -la data/*.json 2>/dev/null || echo "（无任何 json 产物）"
        - name: 清理代理环境
          script: python scripts/setup_proxy_runtime.py --clear
        - name: 合并-校验-保留基线
          script: |
            set -e
            mkdir -p dist
            python scripts/merge_data.py --data-dir data --output dist/merged.json
            python - <<'PY'
            import json, sys
            rows = json.load(open('dist/merged.json', encoding='utf-8'))
            shown = [r for r in rows if r.get('default_show')]
            # 零行＝四源全空/全缺，发布只会刷空线上，硬失败；部分行（单源缺席轮）警告后照常发布：
            # 爬取是全量快照式重爬，缺源只是该源本轮缺席、下轮补回，不发布反而让整站停在更旧的日期。
            # 09-30 实证（sn=cnb-k0o-1k3ovkac0）：源行数不足 min-records 时脚本不写文件、stage 被
            # `|| echo` 兜成 success，merge 全跳过 → 0 行 → 此前 assert 直接炸掉合并腿。
            if len(rows) == 0:
                print("❌ merged 0 rows: 四源全空，拒绝发布（防刷空线上）", file=sys.stderr)
                sys.exit(1)
            if len(rows) < 20 or len(shown) < 5:
                print(f"⚠️ merged thin: rows={len(rows)} shown={len(shown)}（部分源缺席轮，照常发布）")
            PY
            # 本仓 merge_data.py 未定义 build_identity_key/atomic_sources 等符号，
            # scripts/verify_publish_superset.py 与 prepare_pages_payload.py 导入即 ImportError（GitHub 原链路同样从未调用它们），
            # 故按 merge_data.dedupe 的身份键（source, report_no/plan_name）内联实现"基线不缩小"校验
            python - <<'PY'
            import json
            def key(r):
                return (str(r.get('source') or ''), str(r.get('report_no') or r.get('plan_name') or ''))
            rows = json.load(open('dist/merged.json', encoding='utf-8'))
            base = json.load(open('/tmp/cnb-baseline/baseline.json', encoding='utf-8'))
            cand = {key(r) for r in rows}
            base_shown = {key(r) for r in base if r.get('default_show')}
            missing = base_shown - cand
            # GitHub 原链路是「四源 artifact 全到齐才合并」，不存在部分数据轮；CNB 单源易挂，
            # 部分数据轮的基线缺失是该源本轮缺席的自然结果（快照式全量重爬、下轮补回），
            # 硬失败会让整站停在更旧日期——降级为警告列出缺失，零候选行仍硬失败（上方已拦）。
            if missing:
                print(f"⚠️ superset: 基线在展计划缺失 {len(missing)} 条（源缺席轮），例: {sorted(base_shown - cand)[:3]}")
            else:
                print(f"superset verified: 基线在展 {len(base_shown)} 条全部保留")
            # 对齐 GitHub merge-and-filter.yml:111-118：latest=在展子集，filtered=全量（app.js:259 需要 data/filtered.json）
            shown = [r for r in rows if r.get('default_show')]
            json.dump(shown, open('dist/latest.json', 'w', encoding='utf-8'), ensure_ascii=False, indent=1)
            json.dump(rows, open('dist/filtered.json', 'w', encoding='utf-8'), ensure_ascii=False, indent=1)
            PY
            # 对齐 GitHub deploy-pages.yml:50-88：site/ = docs 前端 + config + 数据 + manifest，每次重建、不入仓
            rm -rf site
            mkdir -p site/data site/config
            cp -R docs/. site/
            cp config/filter_conditions.json site/config/filter_conditions.json
            cp dist/latest.json site/data/latest.json
            cp dist/filtered.json site/data/filtered.json
            python - <<'PY'
            import json
            from datetime import datetime, timezone
            rows = json.load(open('site/data/latest.json', encoding='utf-8'))
            manifest = {
                "date": datetime.now(timezone.utc).strftime("%Y%m%d"),
                "updatedAt": datetime.now(timezone.utc).isoformat(),
                "rowCount": len(rows),
                "shownCount": len(rows),
                "sources": sorted({r.get('source') for r in rows}),
                "files": {"latestJson": "data/latest.json", "filteredJson": "data/filtered.json"},
            }
            with open('site/data/manifest.json', 'w', encoding='utf-8') as f:
                json.dump(manifest, f, ensure_ascii=False, indent=2)
            print(f"staged {len(rows)} shown rows into site/")
            PY
            touch site/.nojekyll
        - name: 推送数据到GitHub Release
          timeout: 25m
          script: |
            set -e
            python scripts/publish_github_release.py --site-dir site --repo Fatty911/crawl-sim --workflow cnb-pages.yml
        - name: 发布到Cloudflare Pages
          image: node:22
          script: |
            set -e
            if [ -z "$CLOUDFLARE_API_TOKEN" ]; then
              echo "❌ 未注入 CLOUDFLARE_API_TOKEN：本流水线经 imports 引用 xuerui911-mirror/crawl-secrets env.yml，请检查该私仓。"
              exit 1
            fi
            npx -y wrangler@latest pages deploy site --project-name crawl-sim --commit-dirty=true
        - name: 发布到Codeberg Pages
          script: |
            if [ -z "$CODEBERG_TOKEN" ]; then
              echo "❌ 未注入 CODEBERG_TOKEN：本流水线经 imports 引用 xuerui911-mirror/crawl-secrets env.yml，请检查该私仓。"
              exit 1
            fi
            set -e
            W=$(mktemp -d)
            cp -r site/. "$W/"
            printf '%s\n' 'sim3.jiucai.eu.org' > "$W/.domains"
            cd "$W"
            git init -q -b pages
            git config user.email "xuerui911@gmail.com"
            git config user.name "Fatty911"
            git add -A
            git commit -qm "pages: crawl publish $(date +%Y%m%d%H%M%S)"
            printf '#!/bin/sh\ncase "$1" in *sername*) echo xuerui911;; *) printf "%%s" "$CODEBERG_TOKEN";; esac\n' > /tmp/cb-askpass.sh
            chmod +x /tmp/cb-askpass.sh
            # Codeberg 推送实测间歇瞬断（09-30 sn=cnb-55d 1.7s 秒挂一次；vps 同日三连重试版多次成功），
            # set -e 下单次失败会砍掉后面的线上验收——与 vps 同款三次重试，仍失败保持硬失败不掩盖镜像缺口
            OK=0
            for i in 1 2 3; do
              if GIT_ASKPASS=/tmp/cb-askpass.sh git push -q --force "https://codeberg.org/xuerui911/crawl-sim.git" pages:pages; then
                OK=1; break
              fi
              echo "Codeberg 推送第 $i 次失败，10 秒后重试"
              sleep 10
            done
            rm -f /tmp/cb-askpass.sh
            # 09-30 最后一轮验证（sn=cnb-rnm-1k3q7mer0）：三连重试仍全挂（32s）——CNB 容器到
            # Codeberg 的推送链路间歇劣化已非重试可解。sim3 只是镜像域（CF sim2 是主发布且
            # 已在上一段成功），镜像缺口不应砍掉其后的线上验收（vps 仓同款语义）。
            if [ "$OK" = 1 ]; then
              echo "SIM3_PUSH=done"
            else
              echo "⚠️ Codeberg 三次推送失败，sim3 镜像本轮落后（主发布 sim2 不受影响），继续"
            fi
            rm -rf "$W"
        - name: 线上验收
          script: |
            set -e
            # 对齐 GitHub deploy-pages verify 能力；verify_pages_ui.py:27 BASE 硬编码 sim.jiucai.eu.org（GitHub Pages 域），
            # 无法指向 CNB 发布域，故按 deploy-pages.yml:76-108 的 manifest 回读等值比较验收实际发布目标（CF 硬、Codeberg 软）
            python - <<'PY'
            import json, time, urllib.request
            with open('site/data/manifest.json', encoding='utf-8') as f:
                expected = json.load(f)
            def poll(url, attempts, hard):
                error = "not attempted"
                for attempt in range(attempts):
                    try:
                        req = urllib.request.Request(url, headers={"Cache-Control": "no-cache", "User-Agent": "pages-readback"})
                        with urllib.request.urlopen(req, timeout=30) as r:
                            actual = json.load(r)
                        if actual == expected:
                            print(f"线上验收通过: {url} rowCount={actual.get('rowCount')}")
                            return None
                        error = "deployed manifest != staged"
                    except Exception as exc:
                        error = repr(exc)[:200]
                    time.sleep(15)
                if hard:
                    raise SystemExit(f"❌ {url} 验收失败: {error}")
                print(f"⚠️ {url} 暂未就绪（Codeberg 自定义域待 DNS 生效后自动可见）: {error}")
                return error
            poll("https://sim2.jiucai.eu.org/data/manifest.json", 12, True)
            poll("https://crawl-sim.pages.dev/data/manifest.json", 3, False)
            poll("https://sim3.jiucai.eu.org/data/manifest.json", 2, False)
            PY

  pull_request:
