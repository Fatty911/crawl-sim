name: AI Repair Sim

on:
  workflow_dispatch:
    inputs:
      attempt:
        description: "Bounded repair attempt (1 or 2)"
        required: true
        default: "1"
        type: choice
        options: ["1", "2"]

permissions: {}

concurrency:
  group: ai-sim-repair
  cancel-in-progress: false

jobs:
  freeze_check:
    runs-on: ubuntu-latest
    permissions:
      issues: read
    outputs:
      frozen: ${{ steps.freeze.outputs.frozen }}
    steps:
      - id: freeze
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh issue list --repo "$GITHUB_REPOSITORY" --state open --label ai-sim-frozen \
              --limit 1 --json number --jq 'length > 0' | grep -qx true; then
            echo "frozen=true" >> "$GITHUB_OUTPUT"
          else
            echo "frozen=false" >> "$GITHUB_OUTPUT"
          fi

  generate:
    needs: freeze_check
    if: needs.freeze_check.outputs.frozen != 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@main
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-python@main
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install -r requirements.txt
      - uses: actions/setup-node@main
        with:
          node-version: "22"
      - name: Install OpenCode CLI
        run: npm install --global opencode-ai@latest
      - name: Prepare failure log
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # 合并读取所有审计类 open issue（verify/audit/classify 各自独立，互不互斥；
          # 每个 label 下全部 issue 的 body 都写入，避免只取第一条漏报）
          : > failure.md
          WRITTEN=0
          # 上一次 validate 失败详情优先（模型需针对性修复测试/逻辑）
          for LABEL in sim-repair-validation-failed sim-pages-verify-failed sim-pages-audit-failed sim-pages-classify-audit; do
            BODIES=$(gh issue list --repo "$GITHUB_REPOSITORY" --state open --label "$LABEL" \
              --json number,title,body --jq '.[] | "### issue #\(.number): \(.title)\n\(.body)\n"' --limit 1000 2>/dev/null || true)
            if [ -n "$BODIES" ]; then
              printf '## %s\n%s\n' "$LABEL" "$BODIES" >> failure.md
              WRITTEN=1
              echo "failure log from $LABEL issues"
            fi
          done
          if [ "$WRITTEN" = "0" ]; then
            printf 'crawl-sim pipeline failure. Trigger: AI repair (attempt %s).\nReview the crawler/merge/workflow/files to identify and fix the fault.\n' "${{ inputs.attempt }}" > failure.md
            echo "generic failure log"
          fi
      - name: Generate constrained patch
        env:
          NVIDIA_NIM_API_KEY: ${{ secrets.NVIDIA_NIM_API_KEY }}
          ZENMUX_API_KEY: ${{ secrets.ZENMUX_API_KEY }}
          VOLCENGINE_CODING_PLAN_API_KEY: ${{ secrets.VOLCENGINE_CODING_PLAN_API_KEY }}
          OPENCODE_API_KEY: ${{ secrets.OPENCODE_API_KEY }}
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
          DMIT_PROXY_URL: ${{ secrets.DMIT_PROXY_URL }}
        run: >-
          python scripts/ai_sim_repair.py generate
          --repo .
          --failure failure.md
          --trigger "manual sim repair"
          --patch-out "$RUNNER_TEMP/sim.patch"
      - uses: actions/upload-artifact@main
        with:
          name: sim-ai-patch-${{ github.run_id }}
          path: ${{ runner.temp }}/sim.patch
          if-no-files-found: error
          retention-days: 7

  validate:
    needs: generate
    runs-on: ubuntu-latest
    timeout-minutes: 40
    permissions:
      contents: read
      issues: write
    steps:
      - uses: actions/checkout@main
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-python@main
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install -r requirements.txt
      - uses: actions/download-artifact@main
        with:
          name: sim-ai-patch-${{ github.run_id }}
          path: ${{ runner.temp }}
      - name: Preserve trusted guard outside candidate tree
        run: cp scripts/ai_sim_repair.py "$RUNNER_TEMP/trusted-ai-sim-repair.py"
      - name: Validate patch
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set +e
          python scripts/ai_sim_repair.py validate \
            --repo . \
            --patch "$RUNNER_TEMP/sim.patch" \
            --report "$RUNNER_TEMP/sim-validation.json" > "$RUNNER_TEMP/validate.log" 2>&1
          RC=$?
          set -e
          cat "$RUNNER_TEMP/validate.log"
          if [ "$RC" -ne 0 ]; then
            # 失败详情写入 issue：attempt=2 的 Prepare failure log 会读取，模型针对性修复
            gh label create sim-repair-validation-failed --repo "$GITHUB_REPOSITORY" \
              --color D93F0B --description "AI repair validate 失败详情（供下一 attempt 修复）" 2>/dev/null || true
            {
              echo "## AI repair validate 失败（run $GITHUB_RUN_ID，attempt ${{ inputs.attempt }}）"
              echo ""
              echo '```'
              tail -200 "$RUNNER_TEMP/validate.log"
              echo '```'
              echo "完整日志见 sim-validation artifact（validate.log）"
            } > "$RUNNER_TEMP/validation-issue-body.md"
            # 先创建新 issue，成功后再关旧（避免创建失败时旧 issue 已消失、
            # 下一 attempt 的 Prepare 读不到验证详情）；关旧时排除刚创建的新 issue
            NEW_URL=$(gh issue create --repo "$GITHUB_REPOSITORY" \
                --title "AI repair validation failed: $GITHUB_RUN_ID" \
                --label sim-repair-validation-failed \
                --body-file "$RUNNER_TEMP/validation-issue-body.md") || true
            if [ -n "$NEW_URL" ]; then
              NEW_NUM="${NEW_URL##*/}"
              echo "validation failure issue #$NEW_NUM created"
              for OLD in $(gh issue list --repo "$GITHUB_REPOSITORY" --state open --label sim-repair-validation-failed \
                  --json number --jq '.[].number' --limit 1000 2>/dev/null || true); do
                [ "$OLD" = "$NEW_NUM" ] && continue
                gh issue close "$OLD" --repo "$GITHUB_REPOSITORY" --comment "已被新 validation-failed issue #$NEW_NUM 取代" || true
              done
            else
              # issue 创建失败不能静默：告警 + validate.log 已随 sim-validation artifact 上传兜底
              echo "::warning::validation-failed issue 创建失败；validate.log 已上传 sim-validation artifact"
            fi
            exit "$RC"
          fi
      - name: Verify exact tree
        run: >-
          python "$RUNNER_TEMP/trusted-ai-sim-repair.py" verify-tree
          --repo . --patch "$RUNNER_TEMP/sim.patch" --base-sha "$GITHUB_SHA"
      - uses: actions/upload-artifact@main
        if: always()
        with:
          name: sim-validation-${{ github.run_id }}
          path: |
            ${{ runner.temp }}/sim.patch
            ${{ runner.temp }}/sim-validation.json
            ${{ runner.temp }}/validate.log
          if-no-files-found: warn
          retention-days: 14

  review:
    needs: validate
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@main
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-python@main
        with:
          python-version: "3.12"
      - run: python -m pip install -r requirements.txt
      - uses: actions/setup-node@main
        with:
          node-version: "22"
      - name: Install OpenCode CLI
        run: npm install --global opencode-ai@latest
      - uses: actions/download-artifact@main
        with:
          name: sim-validation-${{ github.run_id }}
          path: ${{ runner.temp }}
      - name: DeepSeek V4 Flash final review
        env:
          NVIDIA_NIM_API_KEY: ${{ secrets.NVIDIA_NIM_API_KEY }}
          DMIT_PROXY_URL: ${{ secrets.DMIT_PROXY_URL }}
        run: >-
          python scripts/ai_patch_review.py
          --patch "$RUNNER_TEMP/sim.patch"
          --validation "$RUNNER_TEMP/sim-validation.json"
          --output "$RUNNER_TEMP/sim-review.json"
      - uses: actions/upload-artifact@main
        with:
          name: sim-review-${{ github.run_id }}
          path: ${{ runner.temp }}/sim-review.json
          if-no-files-found: error
          retention-days: 14

  final_validate:
    needs: review
    runs-on: ubuntu-latest
    timeout-minutes: 25
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@main
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-python@main
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install -r requirements.txt
      - uses: actions/download-artifact@main
        with:
          name: sim-validation-${{ github.run_id }}
          path: ${{ runner.temp }}/validated
      - uses: actions/download-artifact@main
        with:
          name: sim-review-${{ github.run_id }}
          path: ${{ runner.temp }}/reviewed
      - name: Bind reviewer result to exact tested diff
        env:
          BASE_SHA: ${{ github.sha }}
        run: |
          python - "$RUNNER_TEMP/validated/sim.patch" "$RUNNER_TEMP/validated/sim-validation.json" "$RUNNER_TEMP/reviewed/sim-review.json" <<'PY'
          import hashlib, json, os, sys
          patch = open(sys.argv[1], "rb").read(50_000_001)
          assert len(patch) <= 50_000_000
          validation = json.load(open(sys.argv[2], "rb").read(1_000_001))
          review = json.load(open(sys.argv[3], "rb").read(1_000_001))
          digest = hashlib.sha256(patch).hexdigest()
          assert validation["base_sha"] == os.environ["BASE_SHA"]
          assert validation["patch_sha256"] == digest == review["patch_sha256"]
          assert review["review"]["verdict"] == "PASS"
          PY

  finalize:
    needs: final_validate
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      actions: read
      contents: read
    steps:
      - uses: actions/checkout@main
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/download-artifact@main
        with:
          name: sim-validation-${{ github.run_id }}
          path: ${{ runner.temp }}/validated
      - uses: actions/download-artifact@main
        with:
          name: sim-review-${{ github.run_id }}
          path: ${{ runner.temp }}/reviewed
      - name: Apply exact reviewed patch
        run: |
          # --recount：模型 hunk 行号常错（validate 已重算+--recount，finalize 必须一致）；
          # git apply 上下文匹配失败时回退 GNU patch --fuzz=3（与 validate 相同策略）
          if ! git apply --recount --whitespace=error "$RUNNER_TEMP/validated/sim.patch"; then
            # 回退前先清理（git apply 原子失败不留痕；保险起见 + patch 失败会留 .rej/.orig 未跟踪文件）
            git restore --worktree . || true
            git clean -fd || true
            # dry-run 先行：确认可应用再实际 patch（失败即清理退出）
            if ! patch -p1 --fuzz=3 --dry-run < "$RUNNER_TEMP/validated/sim.patch"; then
              git restore --worktree . || true
              git clean -fd || true
              exit 1
            fi
            if ! patch -p1 --fuzz=3 < "$RUNNER_TEMP/validated/sim.patch"; then
              git restore --worktree . || true
              git clean -fd || true
              exit 1
            fi
          fi
          git diff --check
      - name: Commit and push
        env:
          ACTION_PAT: ${{ secrets.ACTION_PAT }}
        run: |
          set -euo pipefail
          git config user.name "Fatty911"
          git config user.email "xuerui911@gmail.com"
          git add -A
          git diff --cached --check
          git commit -m "fix: AI self-repair for operator tariff pipeline"
          original_url=$(git remote get-url origin)
          trap 'git remote set-url origin "$original_url"' EXIT
          test -n "$ACTION_PAT"
          git remote set-url origin "https://x-access-token:${ACTION_PAT}@github.com/${GITHUB_REPOSITORY}.git"
          git push origin HEAD:main
          git remote set-url origin "$original_url"
          trap - EXIT
      - name: Dispatch crawlers to verify
        env:
          GH_TOKEN: ${{ secrets.ACTION_PAT || github.token }}
        run: |
          gh workflow run crawl-unicom.yml --repo "$GITHUB_REPOSITORY" --ref main || true
          gh workflow run crawl-broadnet.yml --repo "$GITHUB_REPOSITORY" --ref main || true
          # 复扫分类审计：修复生效 → 新报告 OK → 自动关闭 sim-pages-classify-audit issue
          # dispatch 失败不静默：告警记录（修复本身已提交推送，复扫失败不回滚修复，但需人工关注）
          if gh workflow run "Pages Classify Audit" --repo "$GITHUB_REPOSITORY" --ref main; then
            echo "dispatched Pages Classify Audit re-scan"
          else
            echo "::warning::分类审计复扫 dispatch 失败，sim-pages-classify-audit issue 需人工关注"
          fi

  follow-up:
    needs: [freeze_check, generate, validate, review, final_validate, finalize]
    if: always() && needs.freeze_check.outputs.frozen != 'true'
    runs-on: ubuntu-latest
    permissions:
      actions: write
      issues: write
    steps:
      - name: Dispatch one bounded retry or freeze
        env:
          GH_TOKEN: ${{ github.token }}
          ATTEMPT: ${{ inputs.attempt }}
          GENERATE: ${{ needs.generate.result }}
          VALIDATE: ${{ needs.validate.result }}
          REVIEW: ${{ needs.review.result }}
          FINAL_VALIDATE: ${{ needs.final_validate.result }}
          FINALIZE: ${{ needs.finalize.result }}
        run: |
          set -euo pipefail
          if [ "$GENERATE/$VALIDATE/$REVIEW/$FINAL_VALIDATE/$FINALIZE" = "success/success/success/success/success" ]; then
            # 修复链全成功：关闭历史 validation-failed issue（下次失败会重建）
            for N in $(gh issue list --repo "$GITHUB_REPOSITORY" --state open --label sim-repair-validation-failed \
                --json number --jq '.[].number' --limit 1000 2>/dev/null || true); do
              gh issue close "$N" --repo "$GITHUB_REPOSITORY" --comment "AI 修复链已成功，验证失败 issue 自动关闭" || true
            done
            exit 0
          fi
          if [ "$ATTEMPT" = "1" ]; then
            gh workflow run ai-sim-repair.yml --repo "$GITHUB_REPOSITORY" --ref main -f attempt=2
            exit 0
          fi
          gh label create ai-sim-frozen --repo "$GITHUB_REPOSITORY" --color B60205 --description "AI sim repair exhausted its bounded attempts" 2>/dev/null || true
          gh issue create --repo "$GITHUB_REPOSITORY" --title "AI sim repair frozen after two attempts" \
            --label ai-sim-frozen \
            --body "Run $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID stopped after two bounded attempts. Results: generate=$GENERATE validate=$VALIDATE review=$REVIEW final_validate=$FINAL_VALIDATE finalize=$FINALIZE."
