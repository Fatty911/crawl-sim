# ── GitHub Actions 硬开关（2026-10-05 用户裁定）────────────────────────
# GitHub 账户曾因反滥用机制误伤暂停，爬虫/AI 自修复禁止在 Actions 运行。
# 工作流主力 = 腾讯云 CNB（.cnb.yml）。此处 if:false 防止 UI 误开后仍执行。
# 七端代码对等同步，仅工作流免费资源不同。
name: Crawl Unicom

on:
  workflow_dispatch:
    inputs:
      debug_mode:
        description: '调试模式（小数据量验证）'
        required: false
        default: 'false'
      max_items:
        description: '最多条数（0=不限）'
        required: false
        default: '0'
  schedule:
    - cron: "13 3 * * *"
    - cron: "13 9 * * *"

permissions:
  contents: read

concurrency:
  group: unicom-crawl
  cancel-in-progress: false

env:
  RUN_TIME: 2400
  CRAWL_MIN_DELAY_SECONDS: 1
  CRAWL_MAX_DELAY_SECONDS: 3

jobs:
  crawl:
    if: false  # CNB 为工作流主力，GitHub Actions 禁跑爬虫/AI 自修复
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@main
        with:
          persist-credentials: false

      - uses: actions/setup-python@main
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: python -m pip install -r requirements.txt

      - name: Configure required crawler proxy (mihomo round-robin)
        env:
          PROXY_SUBSCRIPTIONS: ${{ secrets.PROXY_SUBSCRIPTIONS }}
        run: >-
          python scripts/setup_proxy_runtime.py
          --require-proxy
          --test-url https://imgxx.client.10010.com/zifeizhuanquwt/

      - name: Crawl Unicom tariffs
        run: >-
          python scripts/crawl_unicom.py
          --output data/unicom.json
          --min-records ${{ github.event.inputs.debug_mode == 'true' && '10' || '100' }}
          --delay 0

      - name: Verify output
        run: |
          python - <<'PY'
          import json
          rows = json.load(open('data/unicom.json', encoding='utf-8'))
          assert len(rows) >= 10, f"too few rows: {len(rows)}"
          assert all(r.get('source') == '中国联通' for r in rows)
          print(f"OK: {len(rows)} Unicom rows")
          PY

      - name: Clear crawler proxy
        if: always()
        run: python scripts/setup_proxy_runtime.py --clear

      - name: Upload Unicom artifact
        uses: actions/upload-artifact@main
        with:
          name: unicom-data-${{ github.run_id }}
          path: data/unicom.json
          if-no-files-found: error
          retention-days: 7
