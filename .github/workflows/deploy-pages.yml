name: Deploy Pages

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'docs/**'
      - '.github/workflows/deploy-pages.yml'
  release:
    types: [published]

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@main

      - uses: actions/setup-python@main
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: python -m pip install -r requirements.txt

      - name: Download latest verified Release
        env:
          GH_TOKEN: ${{ secrets.ACTION_PAT || github.token }}
        run: |
          mkdir -p release
          for pat in sim-latest.json sim-filtered.json; do
            gh release download data-latest --repo "$GITHUB_REPOSITORY" --pattern "$pat" --dir release || true
          done
          ls -la release/ || true

      - name: Build site
        run: |
          rm -rf site
          mkdir -p site/data site/config
          cp -R docs/. site/
          cp config/filter_conditions.json site/config/filter_conditions.json
          if [ -s release/sim-latest.json ]; then
            cp release/sim-latest.json site/data/latest.json
          fi
          if [ -s release/sim-filtered.json ]; then
            cp release/sim-filtered.json site/data/filtered.json
          fi
          if [ ! -s site/data/filtered.json ]; then
            echo "::error::release 数据缺失 (sim-filtered.json 下载失败), 拒绝发布空壳站点"
            exit 1
          fi
          python - <<'PY'
          import json, os
          latest_p = 'site/data/latest.json'
          manifest = {
              "date": "",
              "updatedAt": "",
              "rowCount": 0,
              "shownCount": 0,
              "sources": [],
              "files": {"latestJson": "data/latest.json", "filteredJson": "data/filtered.json"},
          }
          if os.path.exists(latest_p):
              rows = json.load(open(latest_p, encoding='utf-8'))
              manifest["rowCount"] = len(rows)
              manifest["shownCount"] = len(rows)
              manifest["sources"] = sorted({r.get('source') for r in rows})
          from datetime import datetime, timezone
          manifest["updatedAt"] = datetime.now(timezone.utc).isoformat()
          manifest["date"] = datetime.now(timezone.utc).strftime("%Y%m%d")
          with open('site/data/manifest.json', 'w', encoding='utf-8') as f:
              json.dump(manifest, f, ensure_ascii=False, indent=2)
          PY
          touch site/.nojekyll

      - name: Configure Pages
        uses: actions/configure-pages@main

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@main
        with:
          path: site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@main

  verify:
    needs: deploy
    if: always() && needs.deploy.result == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      issues: write
      actions: write
    steps:
      - uses: actions/checkout@main

      - uses: actions/setup-python@main
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies + playwright (pinned like crawlers)
        run: |
          python -m pip install -r requirements.txt
          python -m pip install playwright==1.61.0
          python -m playwright install chromium-headless-shell

      - name: Verify deployed page and data expectations
        id: verify
        run: >-
          python scripts/verify_pages_ui.py
          --output "$RUNNER_TEMP/pages-verify-report.json"

      - uses: actions/upload-artifact@main
        if: always()
        with:
          name: pages-verify-report-${{ github.run_id }}
          path: ${{ runner.temp }}/pages-verify-report.json
          if-no-files-found: warn
          retention-days: 14

      - name: Open verification-failed issue
        if: failure() && steps.verify.outcome == 'failure'
        env:
          GH_TOKEN: ${{ secrets.ACTION_PAT || github.token }}
        run: |
          gh label create sim-pages-verify-failed --repo "$GITHUB_REPOSITORY" \
            --color FBCA04 --description "Pages 部署后数据/UI 校验失败" 2>/dev/null || true
          # close any stale open issue of this kind first
          OLD=$(gh issue list --repo "$GITHUB_REPOSITORY" --state open \
                --label sim-pages-verify-failed --json number --jq '.[].number' | head -1)
          if [ -n "$OLD" ]; then gh issue close "$OLD" --repo "$GITHUB_REPOSITORY" || true; fi
          gh issue create --repo "$GITHUB_REPOSITORY" --title "Pages 校验失败: ${{ github.run_id }}" \
            --label sim-pages-verify-failed \
            --body "$(cat "$RUNNER_TEMP/pages-verify-report.json")"

      - name: Trigger bounded AI self-repair
        if: failure() && steps.verify.outcome == 'failure'
        env:
          GH_TOKEN: ${{ secrets.ACTION_PAT || github.token }}
        run: |
          gh workflow run ai-sim-repair.yml --repo "$GITHUB_REPOSITORY" --ref main \
            -f attempt=1 || echo "repair dispatch failed (non-blocking)"

  ai-audit:
    needs: [deploy, verify]
    if: always() && needs.deploy.result == 'success' && needs.verify.result == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    permissions:
      contents: read
      issues: write
    steps:
      - uses: actions/checkout@main

      - uses: actions/setup-python@main
        with:
          python-version: "3.12"
          cache: pip

      - uses: actions/setup-node@main
        with:
          node-version: "22"

      - name: Install deps + playwright + opencode
        run: |
          python -m pip install -r requirements.txt
          python -m pip install playwright==1.61.0
          python -m playwright install chromium-headless-shell
          npm install --global opencode-ai@latest

      - name: Collect page audit (render JS + scan accuracy/readability)
        id: audit
        continue-on-error: true
        run: |
          python scripts/audit_pages_ai.py \
            --output "$RUNNER_TEMP/pages-audit-report.json" \
            --prompt "$RUNNER_TEMP/pages-audit-prompt.md"

      - name: Probe NIM endpoint availability
        id: probe_nim
        env:
          NVIDIA_NIM_API_KEY: ${{ secrets.NVIDIA_NIM_API_KEY }}
        run: |
          # 免费端点可用性每周变化：审查前先探测（529 风控重试 3 次）
          for i in 1 2 3; do
            code=$(curl -s --max-time 30 -o /dev/null -w "%{http_code}" \
              https://integrate.api.nvidia.com/v1/models \
              -H "Authorization: Bearer $NVIDIA_NIM_API_KEY")
            echo "NIM probe attempt $i: HTTP $code"
            if [ "$code" = "200" ]; then
              echo "nim_ok=true" >> "$GITHUB_OUTPUT"
              exit 0
            fi
            sleep 15
          done
          echo "nim_ok=false" >> "$GITHUB_OUTPUT"

      - name: AI review audit report
        id: ai_review
        continue-on-error: true
        env:
          NVIDIA_NIM_API_KEY: ${{ secrets.NVIDIA_NIM_API_KEY }}
          DMIT_PROXY_URL: ${{ secrets.DMIT_PROXY_URL }}
          PROBE_NIM_OK: ${{ steps.probe_nim.outputs.nim_ok }}
        run: |
          python - <<'PY'
          import json, os, subprocess, time
          prompt_file = os.path.join(os.environ["RUNNER_TEMP"], "pages-audit-prompt.md")
          # 探测结果作为运行时门禁：NIM 端点不可用 → 直接强制 NEEDS_ATTENTION（不空跑 AI）
          if os.environ.get("PROBE_NIM_OK", "") != "true":
              msg = "AI 页面审计：NIM 端点探测失败（probe_nim），审查无法执行，需人工查看 run 日志"
              with open(os.path.join(os.environ["RUNNER_TEMP"], "audit-needs-attention"), "w", encoding="utf-8") as fh:
                  fh.write(json.dumps({"conclusion": "NEEDS_ATTENTION", "summary": msg, "real_issues": [{"severity": "error", "item": "nim probe", "reason": msg, "suggestion": "检查 NVIDIA_NIM_API_KEY 与端点可用性"}], "forced": True}, ensure_ascii=False, indent=1))
              with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as fh:
                  fh.write("needs_attention=true\n")
              print("NIM probe failed -> forced NEEDS_ATTENTION")
              raise SystemExit(0)
          # 审计收集失败（无报告/prompt）时不得静默吞掉：强制 NEEDS_ATTENTION
          if not os.path.isfile(prompt_file):
              msg = "AI 页面审计：审计收集步骤失败（未生成报告），需人工查看 run 日志"
              with open(os.path.join(os.environ["RUNNER_TEMP"], "audit-needs-attention"), "w", encoding="utf-8") as fh:
                  fh.write(json.dumps({"conclusion": "NEEDS_ATTENTION", "summary": msg, "real_issues": [{"severity": "error", "item": "audit collection", "reason": msg, "suggestion": "查看 workflow run 日志定位失败原因"}], "audit_failed": True}, ensure_ascii=False, indent=1))
              with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as fh:
                  fh.write("needs_attention=true\n")
              print("audit collection failed -> NEEDS_ATTENTION issue")
              raise SystemExit(0)
          read_only = {
              "*": "deny", "read": "allow", "edit": "deny", "bash": "deny",
              "webfetch": "deny", "task": "deny", "question": "deny", "external_directory": "deny",
          }
          # zenmux key 未授权 deepseek-v4-flash（403 access_denied，2026-08-11 实测），
          # 审查改用 NIM 免费端点（deepseek-ai/deepseek-v4-flash-0731，secret 已有）
          config = {
              "provider": {
                  "nvidia-nim": {
                      "npm": "@ai-sdk/openai-compatible",
                      "name": "nvidia-nim",
                      "options": {"baseURL": "https://integrate.api.nvidia.com/v1", "apiKey": "{env:NVIDIA_NIM_API_KEY}"},
                      "models": {"deepseek-ai/deepseek-v4-flash-0731": {"limit": {"context": 1000000, "output": 8000}}},
                  }
              },
              "agent": {"plan": {"permission": read_only}},
              "permission": read_only,
          }
          env = dict(os.environ)
          env["OPENCODE_CONFIG_CONTENT"] = json.dumps(config, ensure_ascii=False)
          env["OPENCODE_DISABLE_AUTOUPDATE"] = "1"
          env["OPENCODE_DISABLE_TELEMETRY"] = "1"
          proxy = os.environ.get("DMIT_PROXY_URL", "").strip()
          if proxy:
              env["NODE_USE_ENV_PROXY"] = "1"
              env["HTTPS_PROXY"] = proxy
              env["HTTP_PROXY"] = proxy
          cmd = [
              "opencode", "run", "--pure", "--agent", "plan",
              "--model", "nvidia-nim/deepseek-ai/deepseek-v4-flash-0731",
              "--format", "default", "--dir", os.environ["RUNNER_TEMP"],
              "Review the attached page-audit report. Output ONLY the requested JSON (no markdown fence, no extra text).",
              "--file", prompt_file,
          ]

          def parse_verdict(text: str):
              """鲁棒提取 JSON 结论：优先 ```json 代码块，再用 JSONDecoder.raw_decode
              逐个 { 起点解析完整 JSON 值（天然容忍尾部垃圾文本）。
              NIM 免费层偶发输出退化（循环垃圾文本包围 JSON，2026-08-11 实测）。"""
              import re as _re
              dec = json.JSONDecoder()
              cands = _re.findall(r"```(?:json)?\s*(\{.*?\})\s*```", text, _re.S)
              starts = [m.start() for m in _re.finditer(r"\{", text)]
              for cand in cands:
                  try:
                      v = json.loads(cand)
                      if isinstance(v, dict) and str(v.get("conclusion", "")).upper() in ("OK", "BROKEN", "NEEDS_ATTENTION"):
                          return v
                  except Exception:
                      continue
              for i in starts:
                  try:
                      v, _ = dec.raw_decode(text, i)
                      if isinstance(v, dict) and str(v.get("conclusion", "")).upper() in ("OK", "BROKEN", "NEEDS_ATTENTION"):
                          return v
                  except Exception:
                      continue
              return None

          out = None
          verdict = None
          last_err = ""
          # NIM 从 runner IP 有 529 风控（记忆 2026-08-02 实测）；输出退化（垃圾文本/不可解析）
          # 也视为失败重试——只有解析出合法 conclusion 才算成功。初次调用 + 3 次重试 + 封顶退避
          for attempt in range(1, 5):
              try:
                  out = subprocess.run(cmd, env=env, capture_output=True, text=True, timeout=840)
                  if out.returncode == 0:
                      verdict = parse_verdict(out.stdout)
                  if verdict is not None:
                      break
                  last_err = f"exit={out.returncode} output-unparseable"
              except (subprocess.TimeoutExpired, FileNotFoundError, OSError) as exc:
                  last_err = f"{type(exc).__name__}: {str(exc)[:150]}"
              print(f"NIM review attempt {attempt} failed: {last_err}")
              if attempt < 4:
                  time.sleep(30 * attempt)
          if verdict is None:
              # 重试耗尽/输出不可解析：continue-on-error 会吞掉异常，必须显式强制 NEEDS_ATTENTION
              forced = {"conclusion": "NEEDS_ATTENTION",
                        "summary": f"AI 页面审计：opencode(NIM) 审查失败（{last_err}），需人工查看 run 日志",
                        "real_issues": [{"severity": "error", "item": "ai review", "reason": last_err,
                                         "suggestion": "查看 workflow run 日志与 pages-ai-audit artifact"}],
                        "forced": True}
              with open(os.path.join(os.environ["RUNNER_TEMP"], "audit-needs-attention"), "w", encoding="utf-8") as fh:
                  fh.write(json.dumps(forced, ensure_ascii=False, indent=1))
              with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as fh:
                  fh.write("needs_attention=true\n")
              print("opencode(NIM) review failed after retries -> forced NEEDS_ATTENTION")
              raise SystemExit(0)
          ai_text = out.stdout.strip()
          with open(os.path.join(os.environ["RUNNER_TEMP"], "ai-review.md"), "w", encoding="utf-8") as fh:
              fh.write(ai_text[-8000:] + "\n--- stderr tail ---\n" + out.stderr[-1500:])
          print(ai_text[-4000:])
          # verdict 已由 parse_verdict 提取（重试成功路径保证非 None）
          conclusion = str(verdict.get("conclusion", "")).upper()
          if conclusion not in ("OK", "BROKEN", "NEEDS_ATTENTION"):
              # 非法结论值（UNKNOWN/拼写错误/缺失）视为 AI 输出不可用
              conclusion = ""
          # 审计报告含 error 级问题 → 即使 AI 判 OK 也强制 NEEDS_ATTENTION（防 AI 忽略）
          report_error = False
          try:
              report = json.load(open(os.path.join(os.environ["RUNNER_TEMP"], "pages-audit-report.json"), encoding="utf-8"))
              report_error = any(i.get("severity") == "error" for i in report.get("issues", []))
          except Exception:
              report_error = False
          if not conclusion or report_error:
              reason = "AI 审查结论非法" if not conclusion else "审计报告含 error 级问题"
              forced = {"conclusion": "NEEDS_ATTENTION", "summary": f"AI 页面审计：{reason}（AI 原始输出与报告见 artifact）",
                        "real_issues": [{"severity": "error", "item": "audit", "reason": reason,
                                         "suggestion": "查看 pages-ai-audit artifact 的 ai-review.md 与 pages-audit-report.json"}],
                        "forced": True}
              with open(os.path.join(os.environ["RUNNER_TEMP"], "audit-needs-attention"), "w", encoding="utf-8") as fh:
                  fh.write(json.dumps(forced, ensure_ascii=False, indent=1))
              with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as fh:
                  fh.write("needs_attention=true\n")
              print(f"forced NEEDS_ATTENTION: {reason}")
              raise SystemExit(0)
          if conclusion in ("BROKEN", "NEEDS_ATTENTION"):
              with open(os.path.join(os.environ["RUNNER_TEMP"], "audit-needs-attention"), "w", encoding="utf-8") as fh:
                  fh.write(ai_text[-4000:])
              with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as fh:
                  fh.write(f"needs_attention=true\n")
              print(f"AI audit conclusion: {conclusion} -> issue will be opened")
          else:
              with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as fh:
                  fh.write("needs_attention=false\n")
              print(f"AI audit conclusion: {conclusion or 'UNPARSEABLE'} -> no issue")
          PY

      - name: Upload audit artifacts
        if: always()
        uses: actions/upload-artifact@main
        with:
          name: pages-ai-audit-${{ github.run_id }}
          path: |
            ${{ runner.temp }}/pages-audit-report.json
            ${{ runner.temp }}/pages-audit-prompt.md
            ${{ runner.temp }}/ai-review.md
          if-no-files-found: warn
          retention-days: 14

      - name: Open audit-failed issue
        if: steps.ai_review.outputs.needs_attention == 'true'
        env:
          GH_TOKEN: ${{ secrets.ACTION_PAT || github.token }}
        run: |
          gh label create sim-pages-audit-failed --repo "$GITHUB_REPOSITORY" \
            --color FBCA04 --description "Pages AI 审计发现需人工介入问题" 2>/dev/null || true
          # 先捕获 issue 列表并检查失败（进程替换不传失败）；--limit 100 防默认 30 上限
          ISSUES=$(gh issue list --repo "$GITHUB_REPOSITORY" --state open \
                --label sim-pages-audit-failed --json number --jq '.[].number' --limit 100) \
            || { echo "::error::gh issue list 失败，中止新建"; exit 1; }
          FAILED=0
          while IFS= read -r N; do
            [ -z "$N" ] && continue
            gh issue close "$N" --repo "$GITHUB_REPOSITORY" || { echo "WARN: 关闭旧 issue #$N 失败"; FAILED=1; }
          done <<< "$ISSUES"
          if [ "$FAILED" = "1" ]; then
            echo "::error::旧 sim-pages-audit-failed issue 关闭失败，中止新建避免并存"
            exit 1
          fi
          gh issue create --repo "$GITHUB_REPOSITORY" --title "Pages AI 审计: ${{ github.run_id }}" \
            --label sim-pages-audit-failed \
            --body "$(cat "$RUNNER_TEMP/audit-needs-attention")"

      - name: Close audit issue when OK
        if: steps.ai_review.outputs.needs_attention == 'false'
        env:
          GH_TOKEN: ${{ secrets.ACTION_PAT || github.token }}
        run: |
          ISSUES=$(gh issue list --repo "$GITHUB_REPOSITORY" --state open \
                --label sim-pages-audit-failed --json number --jq '.[].number' --limit 100) \
            || { echo "::error::gh issue list 失败"; exit 1; }
          CLOSED=0
          FAILED=0
          while IFS= read -r N; do
            [ -z "$N" ] && continue
            if gh issue close "$N" --repo "$GITHUB_REPOSITORY" \
                --comment "AI 页面审计恢复 OK，自动关闭"; then
              CLOSED=$((CLOSED + 1))
            else
              echo "WARN: 关闭 issue #$N 失败"
              FAILED=1
            fi
          done <<< "$ISSUES"
          echo "closed audit issues: $CLOSED"
          [ "$FAILED" = "1" ] && exit 1
