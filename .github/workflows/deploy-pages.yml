name: Deploy Pages

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'docs/**'
      - '.github/workflows/deploy-pages.yml'
  release:
    types: [published]

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@main

      - uses: actions/setup-python@main
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: python -m pip install -r requirements.txt

      - name: Download latest verified Release
        run: |
          mkdir -p release
          for pat in sim-latest.json sim-filtered.json; do
            gh release download data-latest --repo "$GITHUB_REPOSITORY" --pattern "$pat" --dir release || true
          done

      - name: Build site
        run: |
          rm -rf site
          mkdir -p site/data site/config
          cp -R docs/. site/
          cp config/filter_conditions.json site/config/filter_conditions.json
          if [ -s release/sim-latest.json ]; then
            cp release/sim-latest.json site/data/latest.json
          fi
          if [ -s release/sim-filtered.json ]; then
            cp release/sim-filtered.json site/data/filtered.json
          fi
          python - <<'PY'
          import json, os
          latest_p = 'site/data/latest.json'
          manifest = {
              "date": "",
              "updatedAt": "",
              "rowCount": 0,
              "shownCount": 0,
              "sources": [],
              "files": {"latestJson": "data/latest.json", "filteredJson": "data/filtered.json"},
          }
          if os.path.exists(latest_p):
              rows = json.load(open(latest_p, encoding='utf-8'))
              manifest["rowCount"] = len(rows)
              manifest["shownCount"] = len(rows)
              manifest["sources"] = sorted({r.get('source') for r in rows})
          from datetime import datetime, timezone
          manifest["updatedAt"] = datetime.now(timezone.utc).isoformat()
          manifest["date"] = datetime.now(timezone.utc).strftime("%Y%m%d")
          with open('site/data/manifest.json', 'w', encoding='utf-8') as f:
              json.dump(manifest, f, ensure_ascii=False, indent=2)
          PY
          touch site/.nojekyll

      - name: Configure Pages
        uses: actions/configure-pages@main

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@main
        with:
          path: site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@main

  verify:
    needs: deploy
    if: always() && needs.deploy.result == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      issues: write
      actions: write
    steps:
      - uses: actions/checkout@main

      - uses: actions/setup-python@main
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies + playwright (pinned like crawlers)
        run: |
          python -m pip install -r requirements.txt
          python -m pip install playwright==1.61.0
          python -m playwright install chromium-headless-shell

      - name: Verify deployed page and data expectations
        id: verify
        run: >-
          python scripts/verify_pages_ui.py
          --output "$RUNNER_TEMP/pages-verify-report.json"

      - uses: actions/upload-artifact@main
        if: always()
        with:
          name: pages-verify-report-${{ github.run_id }}
          path: ${{ runner.temp }}/pages-verify-report.json
          if-no-files-found: warn
          retention-days: 14

      - name: Open verification-failed issue
        if: failure() && steps.verify.outcome == 'failure'
        env:
          GH_TOKEN: ${{ secrets.ACTION_PAT || github.token }}
        run: |
          gh label create sim-pages-verify-failed --repo "$GITHUB_REPOSITORY" \
            --color FBCA04 --description "Pages 部署后数据/UI 校验失败" 2>/dev/null || true
          # close any stale open issue of this kind first
          OLD=$(gh issue list --repo "$GITHUB_REPOSITORY" --state open \
                --label sim-pages-verify-failed --json number --jq '.[].number' | head -1)
          if [ -n "$OLD" ]; then gh issue close "$OLD" --repo "$GITHUB_REPOSITORY" || true; fi
          gh issue create --repo "$GITHUB_REPOSITORY" --title "Pages 校验失败: ${{ github.run_id }}" \
            --label sim-pages-verify-failed \
            --body "$(cat "$RUNNER_TEMP/pages-verify-report.json")"

      - name: Trigger bounded AI self-repair
        if: failure() && steps.verify.outcome == 'failure'
        env:
          GH_TOKEN: ${{ secrets.ACTION_PAT || github.token }}
        run: |
          gh workflow run ai-sim-repair.yml --repo "$GITHUB_REPOSITORY" --ref main \
            -f attempt=1 || echo "repair dispatch failed (non-blocking)"
